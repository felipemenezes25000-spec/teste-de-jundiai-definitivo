name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/Jundiai.Api/Jundiai.Api.csproj
      - run: dotnet build src/Jundiai.Api/Jundiai.Api.csproj -c Release --no-restore
