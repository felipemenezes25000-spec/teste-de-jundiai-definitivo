<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>APS / e-SUS · Jundiaí HealthOS</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#eef4f2;--brand:#176b5b;--line:#dce7e3;--muted:#6b7280}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.top h1{margin:3px 0}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}a,button{border:1px solid #d1ddd9;background:#fff;color:#334155;padding:9px 12px;border-radius:10px;text-decoration:none;font:inherit;cursor:pointer}.primary{background:var(--brand);border-color:var(--brand);color:white}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tabs button.active{background:#172033;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.muted{color:var(--muted);font-size:12px}.metric{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.metric strong,.metric span{display:block}.metric span{font-size:11px;color:var(--muted);margin-top:4px}label{display:grid;gap:6px;margin:10px 0;font-size:11px;color:#5c6677}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd8d4;border-radius:9px;background:#fff;font:inherit}textarea{min-height:84px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #eef1f3;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#718096}.table{overflow:auto;border:1px solid var(--line);border-radius:11px}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:white;padding:12px 15px;border-radius:10px;display:none}.toast.show{display:block}.toast.error{background:#9f3128}@media(max-width:820px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><div class="eyebrow">Atenção Primária</div><h1>Território e fichas e-SUS</h1><div class="muted">Cadastro individual · cadastro domiciliar · visita domiciliar · exportação demonstrativa</div></div><div class="actions"><a href="/">Gestão</a><a href="/operations.html">Operação</a><a href="/acs.html">ACS offline</a></div></header>
  <div class="tabs" id="tabs"><button data-tab="individual" class="active">Cadastro individual</button><button data-tab="home">Domicílio</button><button data-tab="visit">Visita</button><button data-tab="overview">Produção APS</button></div>
  <main id="content"><div class="card">Carregando…</div></main>
</div>
<div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);const content=$('#content');const toast=$('#toast');const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-Demo-Role':'poc_admin','X-Demo-User':'acs.poc',...(options.headers||{})}});if(!r.ok){const p=await r.json().catch(()=>({}));throw new Error(p.detail||p.title||`Erro ${r.status}`)}const t=r.headers.get('content-type')||'';return t.includes('json')?r.json():r.text()}
function say(msg,error=false){toast.textContent=msg;toast.className=`toast show${error?' error':''}`;setTimeout(()=>toast.className='toast',2600)}function table(h,r){return `<div class="table"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')}</tbody></table></div>`}
let citizens=[],units=[];function citizenOptions(){return citizens.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.microArea)}</option>`).join('')}function unitOptions(){return units.map(x=>`<option value="${esc(x.code)}">${esc(x.name)}</option>`).join('')}
async function individual(){const rows=await api('/api/psf/esus/individuals');content.innerHTML=`<div class="grid"><section class="card"><h2>Novo cadastro individual</h2><label>Cidadão<select id="cCitizen">${citizenOptions()}</select></label><div class="grid"><label>Raça/cor<input id="cRace" value="Parda"></label><label>Escolaridade<input id="cEdu" value="Ensino médio"></label></div><label>Ocupação<input id="cOcc" value="Trabalhador(a) ativo(a)"></label><div class="grid"><label>Gestante?<select id="cPreg"><option value="false">Não</option><option value="true">Sim</option></select></label><label>Acamado?<select id="cBed"><option value="false">Não</option><option value="true">Sim</option></select></label></div><label>Condições crônicas<input id="cChronic" value="Hipertensão arterial"></label><label>ACS<input id="cAcs" value="Carla Mendes"></label><button class="primary" id="cSave">Registrar ficha individual</button></section><section class="card"><h2>Cadastros realizados</h2>${rows.length?table(['Pessoa','CNS','Área','Microárea','ACS','Gestante','Acamado'],rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.cns)}</td><td>${esc(x.area)}</td><td>${esc(x.microArea)}</td><td>${esc(x.acsName)}</td><td>${x.isPregnant?'sim':'não'}</td><td>${x.isBedridden?'sim':'não'}</td></tr>`)):'<div class="muted">Nenhuma ficha criada nesta sessão.</div>'}</section></div>`;$('#cSave').onclick=async()=>{try{await api('/api/psf/esus/individuals',{method:'POST',body:JSON.stringify({citizenId:$('#cCitizen').value,socialName:null,raceColor:$('#cRace').value,education:$('#cEdu').value,occupation:$('#cOcc').value,hasDisability:false,isPregnant:$('#cPreg').value==='true',isBedridden:$('#cBed').value==='true',chronicConditions:$('#cChronic').value.split(',').map(x=>x.trim()).filter(Boolean),acsName:$('#cAcs').value})});say('Ficha individual registrada.');individual()}catch(e){say(e.message,true)}}}
async function home(){const rows=await api('/api/psf/esus/homes');content.innerHTML=`<div class="grid"><section class="card"><h2>Cadastro domiciliar</h2><label>Endereço<input id="hAddress" value="Rua das Acácias, 120"></label><div class="grid"><label>Área<input id="hArea" value="04"></label><label>Microárea<input id="hMicro" value="04-02"></label></div><div class="grid"><label>Tipo de moradia<input id="hType" value="Casa"></label><label>Abastecimento de água<input id="hWater" value="Rede pública"></label></div><div class="grid"><label>Esgotamento<input id="hSewage" value="Rede coletora"></label><label>Destino do lixo<input id="hGarbage" value="Coleta pública"></label></div><div class="grid"><label>Famílias<input id="hFamilies" type="number" value="1"></label><label>Moradores<input id="hResidents" type="number" value="3"></label></div><label>Unidade de referência<select id="hUnit">${unitOptions()}</select></label><label>ACS<input id="hAcs" value="Carla Mendes"></label><button class="primary" id="hSave">Registrar domicílio</button></section><section class="card"><h2>Domicílios cadastrados</h2>${rows.length?table(['Endereço','Área','Microárea','Moradores','ACS','Unidade'],rows.map(x=>`<tr><td>${esc(x.address)}</td><td>${esc(x.area)}</td><td>${esc(x.microArea)}</td><td>${x.residentCount}</td><td>${esc(x.acsName)}</td><td>${esc(x.referenceUnitName)}</td></tr>`)):'<div class="muted">Nenhum cadastro criado nesta sessão.</div>'}</section></div>`;$('#hSave').onclick=async()=>{try{await api('/api/psf/esus/homes',{method:'POST',body:JSON.stringify({address:$('#hAddress').value,area:$('#hArea').value,microArea:$('#hMicro').value,housingType:$('#hType').value,waterSupply:$('#hWater').value,sewage:$('#hSewage').value,garbageDisposal:$('#hGarbage').value,hasElectricity:true,familyCount:Number($('#hFamilies').value),residentCount:Number($('#hResidents').value),acsName:$('#hAcs').value,referenceUnitCode:$('#hUnit').value})});say('Domicílio registrado.');home()}catch(e){say(e.message,true)}}}
async function visit(){const rows=await api('/api/psf/esus/visits');content.innerHTML=`<div class="grid"><section class="card"><h2>Visita domiciliar</h2><label>Cidadão<select id="vCitizen">${citizenOptions()}</select></label><label>Motivos<input id="vReasons" value="Acompanhamento de crônico, aferição de pressão"></label><div class="grid"><label>Pressão arterial<input id="vBp" value="138/86"></label><label>Glicemia mg/dL<input id="vGly" type="number" value="108"></label></div><div class="grid"><label>Peso kg<input id="vWeight" type="number" step="0.1" value="74.2"></label><label>Cintura cm<input id="vWaist" type="number" step="0.1" value="92"></label></div><label>Desfecho<textarea id="vOutcome">Orientado seguimento na UBS e manutenção de tratamento.</textarea></label><label>ACS<input id="vAcs" value="Carla Mendes"></label><button class="primary" id="vSave">Registrar visita</button></section><section class="card"><h2>Visitas registradas</h2>${rows.length?table(['Cidadão','Data','ACS','PA','Glicemia','Desfecho','Offline'],rows.map(x=>`<tr><td>${esc(x.citizenName)}</td><td>${esc(x.visitDate)}</td><td>${esc(x.acsName)}</td><td>${esc(x.bloodPressure||'—')}</td><td>${esc(x.glycemiaMgDl||'—')}</td><td>${esc(x.outcome)}</td><td>${x.offlineCaptured?'sim':'não'}</td></tr>`)):'<div class="muted">Nenhuma visita criada nesta sessão.</div>'}</section></div>`;$('#vSave').onclick=async()=>{try{await api('/api/psf/esus/visits',{method:'POST',body:JSON.stringify({citizenId:$('#vCitizen').value,acsName:$('#vAcs').value,visitDate:new Date().toISOString().slice(0,10),reasons:$('#vReasons').value.split(',').map(x=>x.trim()).filter(Boolean),anthropometry:{weightKg:Number($('#vWeight').value),heightCm:null,waistCm:Number($('#vWaist').value)},bloodPressure:$('#vBp').value,glycemiaMgDl:Number($('#vGly').value),outcome:$('#vOutcome').value,sharedWithTeam:true,offlineCaptured:false})});say('Visita registrada.');visit()}catch(e){say(e.message,true)}}}
async function overview(){const [i,h,v]=await Promise.all([api('/api/psf/esus/individuals'),api('/api/psf/esus/homes'),api('/api/psf/esus/visits')]);content.innerHTML=`<div class="grid"><div class="card"><div class="eyebrow">Cadastros</div><h2>${i.length} individuais</h2><div class="muted">Pessoas territorializadas nesta sessão.</div></div><div class="card"><div class="eyebrow">Território</div><h2>${h.length} domicílios</h2><div class="muted">Vínculos domiciliares registrados.</div></div></div><div class="card"><div class="eyebrow">Visitas</div><h2>${v.length} registros</h2><p class="muted">A exportação abaixo é propositalmente marcada como demonstração; o layout oficial do e-SUS deve ser versionado/homologado antes de qualquer transmissão real.</p><a class="primary" href="/api/psf/esus/export-demo" target="_blank">Abrir exportação demonstrativa</a></div>`}
const views={individual,home,visit,overview};async function render(name){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));content.innerHTML='<div class="card">Carregando…</div>';try{await views[name]()}catch(e){content.innerHTML=`<div class="card">${esc(e.message)}</div>`}}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>render(b.dataset.tab));Promise.all([api('/api/citizens'),api('/api/units')]).then(x=>{[citizens,units]=x;render('individual')}).catch(e=>content.innerHTML=`<div class="card">${esc(e.message)}</div>`);
</script>
</body></html>
