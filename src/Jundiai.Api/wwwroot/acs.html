<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#176b5b" />
  <title>ACS Campo · Jundiaí HealthOS</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#edf4f2}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;min-height:100vh;background:#f8fbfa}.head{background:#123b34;color:#fff;padding:24px 20px}.head small{color:#a8d4ca}.head h1{margin:6px 0}.network{display:inline-flex;gap:7px;align-items:center;background:rgba(255,255,255,.1);padding:6px 9px;border-radius:999px;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:#47d6a7}.offline .dot{background:#f0b44c}.body{padding:18px}.card{background:#fff;border:1px solid #dfeae6;border-radius:16px;padding:16px;margin-bottom:14px}.card h2{margin-top:0;font-size:17px}label{display:grid;gap:6px;margin:12px 0;font-size:12px;color:#53635f}select,textarea{width:100%;padding:11px;border:1px solid #cfdcd8;border-radius:10px;background:#fff;font:inherit}textarea{min-height:92px;resize:vertical}button,.back{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;padding:12px 14px;background:#176b5b;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#e9f2ef;color:#176b5b}.row{display:flex;gap:10px}.row>*{flex:1}.queue{display:grid;gap:8px}.item{border:1px solid #e2e9e7;border-radius:10px;padding:10px;font-size:12px}.item strong,.item span{display:block}.item span{color:#66726f;margin-top:3px}.ok{padding:10px;border-radius:10px;background:#edf9f5;color:#206b58;font-size:12px}.warn{padding:10px;border-radius:10px;background:#fff7e8;color:#8b6519;font-size:12px}
  </style>
</head>
<body>
<div class="app">
  <header class="head">
    <div id="network" class="network"><span class="dot"></span><span>verificando rede…</span></div>
    <h1>ACS Campo</h1><small>Área e microárea · captura offline com sincronização posterior</small>
  </header>
  <main class="body">
    <div class="row"><a class="back secondary" href="/">← Gestão</a><button id="sync">Sincronizar agora</button></div>
    <section class="card">
      <h2>Registrar visita</h2>
      <label>Domicílio<select id="household"></select></label>
      <label>Tipo de visita<select id="type"><option>Visita periódica</option><option>Busca ativa</option><option>Acompanhamento de crônico</option><option>Gestante/puerpério</option><option>Acamado</option></select></label>
      <label>Desfecho<textarea id="outcome" placeholder="Orientações, necessidades identificadas e próximo passo"></textarea></label>
      <button id="save">Salvar no aparelho</button>
    </section>
    <section class="card">
      <h2>Fila local</h2>
      <div id="queue" class="queue"></div>
    </section>
  </main>
</div>
<script>
const KEY='jundiai.acs.pending.v1';
const household=document.querySelector('#household');
const queue=document.querySelector('#queue');
const network=document.querySelector('#network');
const getQueue=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
const setQueue=(items)=>{localStorage.setItem(KEY,JSON.stringify(items));renderQueue()};
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function net(){const online=navigator.onLine;network.classList.toggle('offline',!online);network.querySelector('span:last-child').textContent=online?'online · pronta para sincronizar':'offline · captura local ativa'}
function renderQueue(){const items=getQueue();queue.innerHTML=items.length?items.map(x=>`<div class="item"><strong>${esc(x.address)}</strong><span>${esc(x.visitType)} · ${new Date(x.occurredAt).toLocaleString('pt-BR')}</span><span>${esc(x.outcome)}</span></div>`).join(''):'<div class="ok">Nenhuma visita pendente.</div>'}
async function load(){try{const r=await fetch('/api/psf/households');const items=await r.json();household.innerHTML=items.map(x=>`<option value="${x.id}" data-address="${esc(x.address)}">${esc(x.microArea)} · ${esc(x.address)}</option>`).join('')}catch{household.innerHTML='<option value="">Território indisponível offline nesta primeira abertura</option>'}}
document.querySelector('#save').onclick=()=>{if(!household.value)return;const selected=household.options[household.selectedIndex];const items=getQueue();items.push({householdId:household.value,address:selected.dataset.address,acsName:'ACS Campo POC',visitType:document.querySelector('#type').value,outcome:document.querySelector('#outcome').value||'Visita registrada',occurredAt:new Date().toISOString(),offlineCaptured:!navigator.onLine});setQueue(items);document.querySelector('#outcome').value=''};
document.querySelector('#sync').onclick=async()=>{const items=getQueue();if(!items.length)return;if(!navigator.onLine)return alert('Sem conexão. As visitas continuam salvas no aparelho.');try{const payload={visits:items.map(({address,...x})=>x)};const r=await fetch('/api/psf/acs/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error();setQueue([]);alert('Visitas sincronizadas com o servidor.')}catch{alert('Não foi possível sincronizar. A fila local foi preservada.')}};
window.addEventListener('online',net);window.addEventListener('offline',net);net();load();renderQueue();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body></html>
