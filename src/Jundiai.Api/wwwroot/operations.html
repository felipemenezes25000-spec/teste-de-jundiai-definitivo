<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Operação Municipal · Jundiaí HealthOS</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#eef3f8;--brand:#176b5b;--line:#dfe6ee;--muted:#6b7280}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.top h1{margin:3px 0}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a{border:1px solid #d6dee7;border-radius:10px;padding:9px 12px;background:#fff;color:#334155;text-decoration:none;font:inherit;cursor:pointer}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tabs button.active{background:#172033;color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 8px 20px rgba(30,45,70,.04)}.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}label{display:grid;gap:6px;font-size:11px;color:#5c6677;margin:9px 0}input,select,textarea{width:100%;border:1px solid #cfd9e4;border-radius:9px;padding:10px;font:inherit;background:#fff}textarea{min-height:86px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #eef1f5;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#718096}.table{overflow:auto;border:1px solid var(--line);border-radius:11px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef3f7;font-size:10px;font-weight:700}.badge.waiting,.badge.planned{background:#fff6df;color:#886313}.badge.called,.badge.active,.badge.available{background:#eaf8f2;color:#176b5b}.metric{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fbfcfd}.metric strong{display:block;font-size:23px;margin-top:5px}.muted{color:var(--muted);font-size:12px}.low{background:#fff8e8}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 15px;border-radius:10px;display:none;max-width:360px}.toast.show{display:block}.error{background:#9f3128!important}@media(max-width:900px){.two,.three{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top"><div><div class="eyebrow">Backoffice municipal</div><h1>Operação integrada</h1><div class="muted">UBS · imunização · farmácia · almoxarifado · prontuário físico/digital · exames</div></div><div class="actions"><a href="/">Centro de comando</a><a href="/citizen.html">Porta Digital</a><a href="/acs.html">ACS Campo</a></div></header>
  <div class="tabs" id="tabs">
    <button data-tab="reception" class="active">Recepção UBS</button><button data-tab="immunization">Imunização</button><button data-tab="pharmacy">Farmácia</button><button data-tab="warehouse">Almoxarifado</button><button data-tab="records">Digitalização</button><button data-tab="diagnostics">Mutirões</button>
  </div>
  <main id="content"><div class="card">Carregando…</div></main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const content=$('#content');const toast=$('#toast');
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-Demo-Role':'poc_admin','X-Demo-User':'operacao.poc',...(options.headers||{})}});if(!r.ok){const p=await r.json().catch(()=>({}));throw new Error(p.detail||p.title||`Erro ${r.status}`)}const t=r.headers.get('content-type')||'';return t.includes('json')?r.json():r.text()}
function say(msg,error=false){toast.textContent=msg;toast.className=`toast show${error?' error':''}`;setTimeout(()=>toast.className='toast',3000)}
function table(headers,rows){return `<div class="table"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
let cache={citizens:[],units:[]};
async function bootstrap(){[cache.citizens,cache.units]=await Promise.all([api('/api/citizens'),api('/api/units')]);render('reception')}
function citizenOptions(){return cache.citizens.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
function unitOptions(){return cache.units.map(x=>`<option value="${esc(x.code)}">${esc(x.name)}</option>`).join('')}
async function reception(){const q=await api('/api/ubs/reception');content.innerHTML=`<div class="grid two"><section class="card"><h2>Check-in</h2><label>Cidadão<select id="rCitizen">${citizenOptions()}</select></label><label>Unidade<select id="rUnit">${unitOptions()}</select></label><label>Serviço<input id="rService" value="Consulta APS"></label><label>Prioridade<select id="rPriority"><option value="routine">Rotina</option><option value="high">Alta</option><option value="urgent">Urgente</option></select></label><label>Observação<textarea id="rNotes"></textarea></label><button class="primary" id="rSave">Registrar chegada</button></section><section class="card"><h2>Fila da unidade</h2>${q.length?table(['Cidadão','Unidade','Serviço','Prioridade','Status','Chegada','Ação'],q.map(x=>`<tr><td>${esc(x.citizenName)}</td><td>${esc(x.unitName)}</td><td>${esc(x.service)}</td><td>${esc(x.priority)}</td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td><td>${fmt(x.arrivedAt)}</td><td>${x.status==='waiting'?`<button onclick="callTicket('${x.id}')">Chamar</button>`:'—'}</td></tr>`)):'<div class="muted">Fila vazia.</div>'}</section></div>`;$('#rSave').onclick=async()=>{try{await api('/api/ubs/reception/checkin',{method:'POST',body:JSON.stringify({citizenId:$('#rCitizen').value,unitCode:$('#rUnit').value,service:$('#rService').value,priority:$('#rPriority').value,notes:$('#rNotes').value})});say('Check-in registrado.');reception()}catch(e){say(e.message,true)}}}
window.callTicket=async id=>{try{await api(`/api/ubs/reception/${id}/call`,{method:'POST',body:JSON.stringify({room:'Sala 03',professional:'Enf. Recepção POC'})});say('Paciente chamado.');reception()}catch(e){say(e.message,true)}};
async function immunization(){const [lots,history,campaigns]=await Promise.all([api('/api/immunization/lots'),api('/api/immunization/history'),api('/api/immunization/campaigns')]);content.innerHTML=`<div class="grid two"><section class="card"><h2>Aplicar vacina</h2><label>Cidadão<select id="iCitizen">${citizenOptions()}</select></label><label>Lote<select id="iLot">${lots.map(x=>`<option value="${x.id}">${esc(x.vaccine)} · ${esc(x.lot)} · saldo ${x.stock}</option>`).join('')}</select></label><div class="grid two"><label>Dose<input id="iDose" value="Dose anual"></label><label>Via<input id="iRoute" value="IM"></label></div><label>Local<input id="iSite" value="Deltoide esquerdo"></label><label>Profissional<input id="iPro" value="Enf. Juliana Ramos"></label><label>Conselho<input id="iCouncil" value="COREN-SP 000000"></label><button class="primary" id="iApply">Registrar aplicação</button></section><section class="card"><h2>Campanhas</h2>${campaigns.map(x=>`<div class="metric"><span class="badge ${esc(x.status)}">${esc(x.status)}</span><strong style="font-size:16px">${esc(x.name)}</strong><div class="muted">${esc(x.vaccine)} · ${esc(x.targetPopulation)}</div></div>`).join('')}</section></div><section class="card"><h2>Histórico vacinal</h2>${history.length?table(['Cidadão','Vacina','Dose','Lote','Via','Profissional','Data'],history.map(x=>`<tr><td>${esc(x.citizenName)}</td><td>${esc(x.vaccine)}</td><td>${esc(x.dose)}</td><td>${esc(x.lot)}</td><td>${esc(x.route)}</td><td>${esc(x.professional)}</td><td>${fmt(x.appliedAt)}</td></tr>`)):'<div class="muted">Sem aplicações nesta sessão.</div>'}</section>`;$('#iApply').onclick=async()=>{try{await api('/api/immunization/administer',{method:'POST',body:JSON.stringify({citizenId:$('#iCitizen').value,vaccineLotId:$('#iLot').value,dose:$('#iDose').value,route:$('#iRoute').value,site:$('#iSite').value,professional:$('#iPro').value,professionalCouncil:$('#iCouncil').value})});say('Aplicação registrada e estoque do lote baixado.');immunization()}catch(e){say(e.message,true)}}}
async function pharmacy(){const [inv,mov]=await Promise.all([api('/api/pharmacy/inventory'),api('/api/pharmacy/movements')]);content.innerHTML=`<div class="grid two"><section class="card"><h2>Dispensar</h2><label>Cidadão<select id="pCitizen">${citizenOptions()}</select></label><label>Lote<select id="pLot">${inv.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.lot)} · saldo ${x.quantity}</option>`).join('')}</select></label><label>Quantidade<input id="pQty" type="number" min="1" value="30"></label><label>Referência da prescrição<input id="pRef" value="RX-POC-0001"></label><label>Farmacêutico<input id="pPro" value="Farm. Responsável POC"></label><button class="primary" id="pDispense">Dispensar e rastrear</button></section><section class="card"><h2>Estoque de farmácia</h2>${table(['Item','Unidade','Lote','Validade','Saldo','Mínimo','Controle'],inv.map(x=>`<tr class="${x.quantity<=x.minimumStock?'low':''}"><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${esc(x.lot)}</td><td>${esc(x.expiresOn)}</td><td>${x.quantity}</td><td>${x.minimumStock}</td><td>${x.controlled?'sim':'não'}</td></tr>`))}</section></div><section class="card"><h2>Rastreabilidade de dispensação</h2>${mov.length?table(['Item','Tipo','Qtd','Cidadão','Referência','Ator','Data'],mov.map(x=>`<tr><td>${esc(x.itemName)}</td><td>${esc(x.type)}</td><td>${x.quantity}</td><td>${esc(x.citizenId||'—')}</td><td>${esc(x.reference||'—')}</td><td>${esc(x.actor)}</td><td>${fmt(x.occurredAt)}</td></tr>`)):'<div class="muted">Nenhuma movimentação nesta sessão.</div>'}</section>`;$('#pDispense').onclick=async()=>{try{await api('/api/pharmacy/dispense',{method:'POST',body:JSON.stringify({citizenId:$('#pCitizen').value,inventoryLotId:$('#pLot').value,quantity:Number($('#pQty').value),prescriptionReference:$('#pRef').value,professional:$('#pPro').value})});say('Dispensação registrada.');pharmacy()}catch(e){say(e.message,true)}}}
async function warehouse(){const [items,mov]=await Promise.all([api('/api/warehouse'),api('/api/warehouse/movements')]);content.innerHTML=`<div class="grid two"><section class="card"><h2>Almoxarifado central</h2>${table(['Item','Lote','Validade','Saldo','Mínimo','Fornecedor'],items.map(x=>`<tr class="${x.quantity<=x.minimumStock?'low':''}"><td>${esc(x.name)}</td><td>${esc(x.lot)}</td><td>${esc(x.expiresOn)}</td><td>${x.quantity}</td><td>${x.minimumStock}</td><td>${esc(x.supplier||'—')}</td></tr>`))}</section><section class="card"><h2>Transferir para unidade</h2><label>Lote<select id="wItem">${items.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.lot)} · ${x.quantity}</option>`).join('')}</select></label><label>Destino<select id="wDest">${unitOptions()}</select></label><label>Quantidade<input id="wQty" type="number" min="1" value="100"></label><label>Referência<input id="wRef" value="REQ-POC-001"></label><button class="primary" id="wTransfer">Transferir</button></section></div><section class="card"><h2>Movimentações do almoxarifado</h2>${mov.length?table(['Item','Tipo','Qtd','Origem','Destino','Referência','Ator','Data'],mov.map(x=>`<tr><td>${esc(x.itemName)}</td><td>${esc(x.type)}</td><td>${x.quantity}</td><td>${esc(x.from||'—')}</td><td>${esc(x.to)}</td><td>${esc(x.reference||'—')}</td><td>${esc(x.actor)}</td><td>${fmt(x.occurredAt)}</td></tr>`)):'<div class="muted">Sem movimentações nesta sessão.</div>'}</section>`;$('#wTransfer').onclick=async()=>{try{await api('/api/warehouse/transfer',{method:'POST',body:JSON.stringify({warehouseItemId:$('#wItem').value,quantity:Number($('#wQty').value),destinationUnitCode:$('#wDest').value,reference:$('#wRef').value,actor:'Almoxarifado POC'})});say('Transferência registrada.');warehouse()}catch(e){say(e.message,true)}}}
async function records(){const rows=await api('/api/records/digitized');content.innerHTML=`<div class="grid two"><section class="card"><h2>Digitalizar / indexar</h2><label>Cidadão<select id="dCitizen">${citizenOptions()}</select></label><label>Tipo documental<select id="dType"><option>Prontuário físico</option><option>Laudo externo</option><option>Documento histórico</option></select></label><label>Páginas<input id="dPages" type="number" min="1" value="24"></label><label>Unidade de origem<select id="dUnit">${cache.units.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></label><label>Referência física<input id="dStorage" value="ARQ-A/BOX-001"></label><button class="primary" id="dSave">Gerar barcode e registrar</button></section><section class="card"><h2>Custódia digital/física</h2><div class="muted">Controle de localização, retirada e devolução do acervo migrado.</div></section></div><section class="card">${rows.length?table(['Cidadão','Barcode','Tipo','Páginas','Origem','Localização','Status','Custódia'],rows.map(x=>`<tr><td>${esc(x.citizenName)}</td><td><code>${esc(x.barcode)}</code></td><td>${esc(x.documentType)}</td><td>${x.pages}</td><td>${esc(x.sourceUnit)}</td><td>${esc(x.storageReference||'—')}</td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td><td>${x.status==='available'?`<button onclick="checkoutRecord('${x.id}')">Retirar</button>`:`<button onclick="returnRecord('${x.id}')">Devolver</button>`}</td></tr>`)):'<div class="muted">Nenhum documento indexado nesta sessão.</div>'}</section>`;$('#dSave').onclick=async()=>{try{await api('/api/records/digitized',{method:'POST',body:JSON.stringify({citizenId:$('#dCitizen').value,barcode:null,documentType:$('#dType').value,pages:Number($('#dPages').value),sourceUnit:$('#dUnit').value,storageReference:$('#dStorage').value,actor:'Arquivo POC'})});say('Documento indexado com barcode.');records()}catch(e){say(e.message,true)}}}
window.checkoutRecord=async id=>{try{await api(`/api/records/digitized/${id}/checkout`,{method:'POST',body:JSON.stringify({actor:'Arquivo POC',reason:'Consulta assistencial demonstrativa'})});say('Custódia registrada.');records()}catch(e){say(e.message,true)}};window.returnRecord=async id=>{try{await api(`/api/records/digitized/${id}/return`,{method:'POST',body:JSON.stringify({actor:'Arquivo POC'})});say('Devolução registrada.');records()}catch(e){say(e.message,true)}};
async function diagnostics(){const [exams,mut]=await Promise.all([api('/api/diagnostics/exams'),api('/api/diagnostics/mutiroes')]);content.innerHTML=`<div class="grid two"><section class="card"><h2>Agenda de exames</h2>${table(['Cidadão','Exame','Status','Agendamento','Unidade'],exams.map(x=>`<tr><td>${esc(x.citizenName)}</td><td>${esc(x.exam)}</td><td>${esc(x.status)}</td><td>${fmt(x.scheduledAt)}</td><td>${esc(x.unit)}</td></tr>`))}</section><section class="card"><h2>Mutirões</h2>${mut.map(x=>`<div class="metric"><span class="badge ${esc(x.status)}">${esc(x.status)}</span><strong style="font-size:16px">${esc(x.name)}</strong><div class="muted">${esc(x.exam)} · ${esc(x.unit)} · ${x.booked}/${x.capacity} vagas</div></div>`).join('')}</section></div>`}
const views={reception,immunization,pharmacy,warehouse,records,diagnostics};async function render(name){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));content.innerHTML='<div class="card">Carregando…</div>';try{await views[name]()}catch(e){content.innerHTML=`<div class="card"><strong>Erro</strong><div class="muted">${esc(e.message)}</div></div>`}}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>render(b.dataset.tab));bootstrap().catch(e=>content.innerHTML=`<div class="card">${esc(e.message)}</div>`);
</script>
</body></html>
